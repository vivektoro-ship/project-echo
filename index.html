<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e07b00">
<title>Echo — Issue Reporting Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --paper:#fdf7ee; --paper-deep:#f7eddd; --card:#ffffff; --rule:#efe2cd; --rule-soft:#f5ecdd;
  --ink:#20180f; --ink-soft:#6b5c48; --ink-faded:#9c8b73;
  --hint:#e02b1b;
  --orange:#e07b00; --orange-deep:#a85200; --amber:#f0a824; --amber-bright:#ffc65c;
  --display:"Fraunces",Georgia,serif; --body:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  /* device width — the only knob for viewer size; height follows the image */
  --devw:258px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 10% 2%,rgba(224,123,0,.06),transparent 40%),radial-gradient(circle at 94% 92%,rgba(240,168,36,.10),transparent 46%);
  background-attachment:fixed;overflow-x:hidden}
img{max-width:100%}

/* ============ mobile first ============ */
.wrap{width:100%;max-width:72rem;margin:0 auto;padding:0 18px}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(253,247,238,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.topbar .inner{max-width:72rem;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,var(--orange),var(--amber));display:grid;place-items:center;flex:none;
  font-family:var(--display);font-weight:600;color:#fff;font-size:15px;line-height:1}
.topbar .nm{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.topbar .tag{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faded);margin-left:auto;white-space:nowrap}

/* masthead — compact on mobile */
.mast{text-align:center;padding:22px 0 2px}
.kicker{font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange)}
.mast h1{font-family:var(--display);font-weight:600;font-optical-sizing:auto;font-size:clamp(26px,7.2vw,60px);line-height:1.05;letter-spacing:-.02em;margin:9px 0 0;text-wrap:balance}
.mast h1 em{font-style:italic;color:var(--orange)}
.mast .dek{font-family:var(--display);font-style:italic;font-size:clamp(13.5px,3.3vw,18px);color:var(--ink-soft);margin:10px auto 0;max-width:34rem;line-height:1.45}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;max-width:14rem}
.orn .ln{height:1px;background:var(--rule);flex:1}
.orn .gl{color:var(--amber);font-size:13px}


/* flow section */
.flows{padding:34px 0 8px}

/* flow tabs — horizontally scrollable on mobile */
.flowtabs{display:flex;gap:7px;margin-top:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-ms-overflow-style:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.flowtabs::-webkit-scrollbar{display:none}
.flowtab{appearance:none;cursor:pointer;flex:none;scroll-snap-align:start;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--card);border:1px solid var(--rule);color:var(--ink-soft);border-radius:99px;padding:10px 13px;
  display:flex;align-items:center;gap:6px;transition:.15s;min-height:40px}
.flowtab:hover{border-color:var(--amber);color:var(--orange)}
.flowtab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.flowtab b{font-family:var(--display);font-weight:600;font-size:12px;color:var(--orange)}
.flowtab.active b{color:var(--amber-bright)}


/* progress */
.pbar{height:2px;background:var(--rule-soft);position:relative;overflow:hidden;margin-top:16px}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange);transition:width .3s ease}

/* player: single column on mobile, step text ABOVE the phone,
   controls pinned to the thumb zone so they are never below the fold */
.player{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;
  grid-template-areas:"head" "body" "frame" "ctrl"}
.stephead{grid-area:head}
.stepbody{grid-area:body}
/* phone comes after the text on mobile and carries bottom clearance so its
   base can be scrolled clear of the sticky control bar */
.framecol{grid-area:frame;display:flex;justify-content:center;padding-bottom:80px}
.controls{grid-area:ctrl}
.phone{width:100%;max-width:var(--devw);background:#fff;border:1px solid var(--rule);border-radius:32px;padding:8px;
  box-shadow:0 26px 52px -26px rgba(150,80,0,.32),0 2px 8px rgba(0,0,0,.05)}
.phone .notch{width:38%;height:5px;background:var(--rule);border-radius:99px;margin:2px auto 8px}
/* The viewer takes each screenshot's own aspect ratio (set from the image's
   natural size as it loads), so every screen fills the frame exactly — no
   white down the side, none at the bottom. Frames run 832-925px tall, so the
   device height varies by about 11% across the set. 375:835 is the pre-load
   fallback, matching each flow's first screen. */
.phone .screen{position:relative;border-radius:25px;overflow:hidden;background:#fff;border:1px solid var(--rule-soft);
  aspect-ratio:375/835;height:auto}
.phone .screen img{display:block;width:100%;height:100%;object-fit:contain;object-position:top center;background:#fff;cursor:pointer}

/* animated tap hint.
   b = steady ring with a breathing glow; i = expanding tap ripples (tap targets only).
   The rings sit inset:-5px so they clear the control instead of tracing it.
   data-kind: tap = something to press, look = something to notice.
   data-shape: dot = small near-square target, drawn as a circle. */
.hint{position:absolute;display:none;z-index:6;pointer-events:none}
.hint b,.hint i{position:absolute;inset:-5px;border:3px solid var(--hint);border-radius:13px;animation:none}
.hint[data-shape="dot"] b,.hint[data-shape="dot"] i{border-radius:50%;inset:-7px}
.hint b{box-shadow:0 0 13px rgba(224,43,27,.5),inset 0 0 13px rgba(224,43,27,.13)}
.hint i{opacity:0}
.hint.go b{animation:hintGlow 1.9s ease-in-out infinite}
.hint.go i{animation:hintRipple 1.9s cubic-bezier(.2,.72,.3,1) infinite}
.hint.go i:nth-of-type(2){animation-delay:.95s}
.hint[data-kind="look"] i{display:none}
.hint[data-kind="look"] b{border-style:dashed}
@keyframes hintGlow{0%,100%{box-shadow:0 0 7px rgba(224,43,27,.34),inset 0 0 8px rgba(224,43,27,.08);opacity:.84}
  50%{box-shadow:0 0 22px rgba(224,43,27,.62),inset 0 0 18px rgba(224,43,27,.2);opacity:1}}
@keyframes hintRipple{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.hint.go b,.hint.go i{animation:none}.hint i{display:none}}

/* intro card */
.intro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;
  background:linear-gradient(160deg,var(--orange),var(--orange-deep));color:#fff}
.intro span{font-family:var(--display);font-weight:600;font-size:clamp(24px,7vw,34px);line-height:1.1;letter-spacing:-.01em}

.stephead,.stepbody{min-width:0}
.count{display:flex;align-items:baseline;justify-content:center;gap:5px;margin-bottom:8px}
.count b{font-family:var(--display);font-weight:600;font-size:17px;line-height:1;color:var(--orange)}
.count i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faded)}
.btnrow{display:flex;align-items:center;gap:9px}
.stephead h4.label{font-family:var(--body);font-weight:700;font-size:clamp(17px,4.4vw,21px);letter-spacing:0}
.stephead h4{font-family:var(--display);font-weight:600;font-size:clamp(20px,5.2vw,30px);letter-spacing:-.01em;line-height:1.14;text-wrap:balance;margin-top:4px}
.stepbody{padding-bottom:0}
.stepbody p.cap{font-size:14.5px;line-height:1.6;color:var(--ink-soft);max-width:34rem}

/* controls — pinned to the thumb zone on mobile */
.controls{display:block;
  position:sticky;bottom:0;z-index:30;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 62%,rgba(253,247,238,0));border-top:1px solid var(--rule-soft)}
button.nav{appearance:none;cursor:pointer;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  background:#fff;border:1px solid var(--rule);color:var(--ink);border-radius:9px;padding:14px 16px;min-height:48px;flex:1;min-width:0;transition:.16s}
button.nav:hover{border-color:var(--ink)}
button.nav:disabled{opacity:.38;cursor:default}
button.nav.primary{background:var(--orange);border-color:var(--orange);color:#fff}
button.nav.primary:hover{background:var(--orange-deep);border-color:var(--orange-deep)}

/* screen quick-nav: one line, horizontally scrollable, active number centred */
.dots{display:flex;flex-wrap:nowrap;gap:5px;margin-top:12px;overflow-x:auto;padding:2px 0 6px;
  scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.dots::-webkit-scrollbar{display:none}
.dot{appearance:none;cursor:pointer;flex:none;scroll-snap-align:center;background:#fff;border:1px solid var(--rule);color:var(--ink-faded);
  font-family:var(--mono);font-size:10px;min-width:32px;height:32px;border-radius:8px;padding:0 5px;transition:.14s}
.dot:hover{border-color:var(--amber);color:var(--orange)}
.dot.active{background:var(--orange);border-color:var(--orange);color:#fff}
.dot.done{color:var(--ink-soft)}

footer{text-align:center;padding:44px 0 60px;color:var(--ink-faded);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1.9}

/* ============ tablet ============ */
@media(min-width:640px){
  .wrap{padding:0 24px}
  .mast{padding:58px 0 6px}
  .flows{padding:52px 0 8px}
  :root{--devw:272px}
}
/* ============ desktop: phone beside the text, controls back in flow ============ */
@media(min-width:960px){
  /* the phone spans the text rows, so a trailing 1fr row soaks up the leftover
     height — otherwise it is shared out between title, caption and controls */
  .player{grid-template-columns:minmax(0,300px) 1fr;gap:clamp(26px,4vw,48px);margin-top:26px;align-items:start;
    grid-template-areas:"frame head" "frame body" "frame ctrl" "frame pad";
    grid-template-rows:max-content max-content max-content 1fr}
  .player.rev{grid-template-columns:1fr minmax(0,300px);
    grid-template-areas:"head frame" "body frame" "ctrl frame" "pad frame"}
  .stephead{margin-top:-4px}
  .stepbody p.cap{margin-top:10px}
  .framecol{align-self:start}
  :root{--devw:284px}
  .count{justify-content:flex-start}
  .controls{position:static;padding:0;margin-top:18px;background:none;border-top:0}
  .framecol{padding-bottom:0}
  button.nav{flex:0 0 auto;min-width:132px}
  .topbar .inner{padding:12px 24px}
  .mark{width:30px;height:30px;font-size:17px}
  .topbar .nm{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<div class="topbar"><div class="inner">
  <span class="mark">E</span>

</div></div>

<div class="wrap">

    <div class="kicker">Field-staff issue reporting</div>

    <div class="orn"><span class="ln"></span><span class="gl">✦</span><span class="ln"></span></div>

  Every screen built from Figma · px-app-echo

<script>
const B='assets/screens/';

/* Each flow: k=key, n=tab name, t=intro title, s=intro sub, screens[{i,l,t,c}] */
const FLOWS=[
{k:'visit',n:'Report from details page',screens:[

 {i:'s08.png',t:'Issue reported — a PSUP ticket is also created',h:null,a:[16,66,68,21,"l"]},
 {i:'s09.png',t:'Status is <b>Reported</b> — wait for the team to pick it up',h:null,a:[3,87.2,79,5,"t"]},
 {i:'s10.png',t:'<b>Ask for an update</b> — choose a quick update message and modify it if you want',h:null,a:[6,50.5,84,34,"t"]},
 {i:'s11.png',t:'Add an attachment with your message if you want, and send',h:null,a:[83.5,87.2,11.5,5,"t"]},

]},
{k:'home',n:'Report from Home screen',screens:[
 {i:'',t:'Report from the Home screen',h:null},
 {i:'hm01.png',t:'Home screen — tap the orange <b>flag</b> to report an issue',h:null,a:[78.5,75.5,13,6.5,"t"]},
 {i:'hm02.png',t:'No visit is open, so fill the details yourself',h:null,a:[4.5,17.5,91,42.5,"l"]},
 {i:'hm03.png',t:'Pick the visit from the list',h:null,a:[6,27,88,29,"t"]},
 {i:'hm05.png',t:'Choose the category that matches your issue',h:null,a:[5,71,90,20,"t"]},
 {i:'hm04.png',t:'Once all details are added, tap <b>Report Issue</b>',h:null,a:[5.3,85.5,89.3,6.6,"t"]},
 {i:'hm06.png',t:'Issue already reported — ask for an update on it instead, or report as a new issue',h:null,a:[4,83.4,89,7,"t"]},
 {i:'hm07.png',t:'Reporting your issue to the tech team',h:null,a:[5.3,85.5,89.3,6.6,"l"]},
 {i:'hm08.png',t:'Issue reported — a PSUP ticket is also created',h:null,a:[16,66,68,21,"l"]},
 {i:'s09.png',t:'Status is <b>Reported</b> — wait for the team to pick it up',h:null,a:[3,87.2,79,5,"t"]},
 {i:'s10.png',t:'<b>Ask for an update</b> — choose a quick update message and modify it if you want',h:null,a:[6,50.5,84,34,"t"]},
 {i:'s11.png',t:'Add an attachment with your message if you want, and send',h:null,a:[83.5,87.2,11.5,5,"t"]},

 {i:'s14.png',t:'Write your response in the field and proceed',h:null,a:[4.5,35,90,21,"t"]},
 {i:'s15.png',t:'<b>Attach files (optional)</b> — add a file if it helps, then tap <b>Submit</b>',h:null,a:[5.3,85.5,89.3,6.6,"t"]},

]},
{k:'list',n:'All reported issues',screens:[
 {i:'',t:'See all your reported issues',h:null},

]},
{k:'multi',n:'Many issues on one visit',screens:[

const tabsEl=document.getElementById('flowtabs'),
      playerEl=document.getElementById('player'), dotsEl=document.getElementById('dots'),
      progEl=document.getElementById('prog');

let flowIdx=0, idx=0, prevIdx=-1;

tabsEl.innerHTML=FLOWS.map((f,i)=>
  `<button class="flowtab" data-f="${i}"><b>${String(i+1).padStart(2,'0')}</b>${f.n}</button>`).join('');

playerEl.innerHTML=
  `<div class="stephead"><h4 id="ptit"></h4></div>`+
  `<div class="framecol"><div class="phone"><div class="notch"></div><div class="screen">`+
  `<img id="pimg" alt=""><div class="hint" id="phint"><b></b><i></i><i></i></div><div class="intro" id="pintro"></div>`+
  `</div></div></div>`+

  `<div class="controls"><div class="count"><b id="pnum"></b><i id="pof"></i></div>`+
  `<div class="btnrow"><button class="nav" id="pprev">← Prev</button><button class="nav primary" id="pnext">Next →</button></div></div>`;

const q=s=>document.querySelector(s);
const img=q('#pimg'),num=q('#pnum'),of=q('#pof'),tit=q('#ptit'),hint=q('#phint'),intro=q('#pintro'),
      prev=q('#pprev'),next=q('#pnext'),scr=q('.screen');

function flow(){return FLOWS[flowIdx];}

function renderTabs(){
  [...tabsEl.children].forEach((b,i)=>b.classList.toggle('active',i===flowIdx));
  dotsEl.innerHTML=flow().screens.map((d,i)=>`<button class="dot" data-i="${i}" title="${d.t}">${i+1}</button>`).join('');
}
function render(){
  const f=flow(), d=f.screens[idx], dots=[...dotsEl.children];
  const isIntro=!d.i;
  intro.style.display=isIntro?'flex':'none';
  intro.innerHTML=isIntro?('<span>'+d.t+'</span>'):'';
  img.style.display=isIntro?'none':'';
  if(!isIntro){ img.src=B+d.i; img.alt=d.t.replace(/<[^>]+>/g,''); }
  tit.innerHTML=d.t;
  num.textContent=idx+1; of.textContent='of '+f.screens.length;
  /* animated hint: a=[left%,top%,w%,h%,kind] where kind 'l' = look at, else tap */
  if(d.a && !isIntro){
    const [ax,ay,aw,ah,ak]=d.a;
    hint.style.display='block';
    hint.style.left=ax+'%'; hint.style.top=ay+'%'; hint.style.width=aw+'%'; hint.style.height=ah+'%';
    hint.dataset.kind=ak==='l'?'look':'tap';
    const pw=aw*3.75, ph=ah*8.35;                       /* back to 375x835 px */
    hint.dataset.shape=(ak!=='l'&&pw<72&&ph<72&&Math.abs(pw-ph)<18)?'dot':'box';
    hint.classList.remove('go'); void hint.offsetWidth; hint.classList.add('go');
  } else { hint.style.display='none'; hint.classList.remove('go'); }
  const fit=()=>{ if(img.naturalWidth&&img.naturalHeight) scr.style.aspectRatio=img.naturalWidth+'/'+img.naturalHeight; };
  if(!isIntro){ if(img.complete) fit(); else img.onload=fit; } else scr.style.aspectRatio='375/835';
  const atEnd=idx===f.screens.length-1, atStart=idx===0;
  const hasNext=flowIdx<FLOWS.length-1, hasPrev=flowIdx>0;
  next.disabled=atEnd&&!hasNext; prev.disabled=atStart&&!hasPrev;
  next.innerHTML=atEnd&&hasNext?'Next flow →':'Next →';
  prev.innerHTML=atStart&&hasPrev?'← Previous flow':'← Prev';
  if(scr) scr.scrollTop=0;
  dots.forEach((b,i)=>{b.classList.toggle('active',i===idx);b.classList.toggle('done',i<idx);});
  progEl.style.width=((idx+1)/f.screens.length*100)+'%';
  const ad=dots[idx]; if(ad&&ad.scrollIntoView) ad.scrollIntoView({block:'nearest',inline:'center'});
  prevIdx=idx;
  playerEl.className='player'+(flowIdx%2?' rev':'');
}
function goFlow(i,last){flowIdx=i;idx=last?FLOWS[i].screens.length-1:0;prevIdx=-1;renderTabs();render();
  document.getElementById('flows').scrollIntoView({block:'start'});}
prev.onclick=()=>{ if(idx>0){idx--;render();return;} if(flowIdx>0) goFlow(flowIdx-1,true); };
next.onclick=()=>{ if(idx<flow().screens.length-1){idx++;render();return;} if(flowIdx<FLOWS.length-1) goFlow(flowIdx+1,false); };
tabsEl.onclick=e=>{const b=e.target.closest('.flowtab');if(b){flowIdx=+b.dataset.f;idx=0;prevIdx=-1;renderTabs();render();
  document.getElementById('flows').scrollIntoView({block:'start'});}};
dotsEl.onclick=e=>{const b=e.target.closest('.dot');if(b){idx=+b.dataset.i;render();}};

/* tapping the screen advances the walkthrough */
img.addEventListener('click',()=>next.click());
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')next.click();
  if(e.key==='ArrowLeft')prev.click();
});
/* swipe on the phone */
let sx=null;
scr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
scr.addEventListener('touchend',e=>{
  if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)<45)return;
  if(dx<0)next.click(); else prev.click();
},{passive:true});

/* Only show screens whose export exists, so the site is never broken while
   the remaining Figma exports land. Flows with nothing exported drop out. */
function probe(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(true);im.onerror=()=>r(false);im.src=src;});}
(async()=>{
  const keep=await Promise.all(FLOWS.map(async f=>{
    /* intro cards have no image (i:'') — always keep them */
    const ok=await Promise.all(f.screens.map(s=>s.i?probe(B+s.i):Promise.resolve(true)));
    f.screens=f.screens.filter((_,i)=>ok[i]);
    return f.screens.length>0;
  }));
  for(let i=FLOWS.length-1;i>=0;i--) if(!keep[i]) FLOWS.splice(i,1);
  flowIdx=0; idx=0; prevIdx=-1;
  tabsEl.innerHTML=FLOWS.map((f,i)=>
    `<button class="flowtab" data-f="${i}"><b>${String(i+1).padStart(2,'0')}</b>${f.n}</button>`).join('');
  renderTabs(); render();
})();
</script>
